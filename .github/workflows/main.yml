name: 'Deploy Vite App to gh-pages'

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Run Deploy on Main
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Ensure it runs only on main branch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run deploy
        run: npm run deploy
